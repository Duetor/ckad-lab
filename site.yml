---
- name: Provision CKAD lab (minikube + tools + exercises)
  hosts: lab
  become: false
  gather_facts: true

  pre_tasks:
    - name: Check that the target is Debian/Ubuntu
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: "This playbook only supports Debian/Ubuntu (detected: {{ ansible_distribution }})."

    - name: Check minimum resources
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb >= (minikube_memory_mb | int + 1024)
          - ansible_processor_vcpus >= (minikube_cpus | int)
        fail_msg: >-
          Not enough resources: {{ ansible_memtotal_mb }} MB RAM / {{ ansible_processor_vcpus }} vCPU.
          At least {{ minikube_memory_mb | int + 1024 }} MB and {{ minikube_cpus }} vCPU are needed
          (adjust minikube_memory_mb / minikube_cpus in group_vars/all.yml).
      when: not (skip_resource_check | default(false) | bool)

  roles:
    - role: prereqs
      tags: [prereqs]
    - role: docker
      tags: [docker]
    - role: kubectl
      tags: [kubectl]
    - role: helm
      tags: [helm]
    - role: minikube
      tags: [minikube]
    - role: shell
      tags: [shell]
    - role: lab
      tags: [lab]
