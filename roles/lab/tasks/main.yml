---
- name: Create the lab folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ lab_dir }}"
    - "{{ lab_answers_dir }}"

- name: Copy the exercises, the CLI and the helpers
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "{{ lab_dir }}/"
    mode: preserve
  loop:
    - bin
    - lib
    - exercises

- name: Expose the ckad command
  become: true
  ansible.builtin.file:
    src: "{{ lab_dir }}/bin/ckad"
    dest: /usr/local/bin/ckad
    state: link
    force: true

- name: Install ckad bash completion
  become: true
  ansible.builtin.copy:
    dest: /etc/bash_completion.d/ckad
    mode: "0644"
    content: |
      _ckad() {
        local cur=${COMP_WORDS[COMP_CWORD]}
        if [ "$COMP_CWORD" -eq 1 ]; then
          COMPREPLY=( $(compgen -W "list start show hint check solution reset exam status" -- "$cur") )
        else
          COMPREPLY=( $(compgen -W "all $(ls {{ lab_dir }}/exercises | cut -c1-2)" -- "$cur") )
        fi
      }
      complete -F _ckad ckad

- name: Final message
  ansible.builtin.debug:
    msg:
      - "Lab ready! Open a new terminal (or: source ~/.bashrc), then:"
      - "  ckad list        # list the exercises"
      - "  ckad start 01    # set up and show exercise 01"
      - "  ckad check 01    # grade your work   (ckad hint 01 if stuck)"
