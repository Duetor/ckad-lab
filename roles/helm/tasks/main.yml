---
- name: Read the installed Helm version
  ansible.builtin.command: helm version --template "{{ '{{' }} .Version {{ '}}' }}"
  register: helm_current
  changed_when: false
  failed_when: false

- name: Install Helm {{ helm_version }}
  when: helm_current.rc != 0 or helm_current.stdout != helm_version
  block:
    - name: Download the Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ bin_arch }}.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-{{ bin_arch }}.tar.gz.sha256sum"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        mode: "0644"

    - name: Extract the archive
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Copy the helm binary
      become: true
      ansible.builtin.copy:
        src: "/tmp/linux-{{ bin_arch }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
