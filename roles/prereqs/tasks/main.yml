---
- name: Refuse to run as root (minikube with the docker driver forbids it)
  ansible.builtin.assert:
    that: lab_user != "root"
    fail_msg: "Run the playbook as your normal user (with -K for sudo), not as root."

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - bash-completion
      - ca-certificates
      - conntrack
      - curl
      - git
      - gnupg
      - jq
      - tar
      - vim
    state: present
    update_cache: true
    cache_valid_time: 3600
