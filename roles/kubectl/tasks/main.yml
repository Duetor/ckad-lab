---
- name: Install kubectl {{ kubectl_version }}
  become: true
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ bin_arch }}/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ bin_arch }}/kubectl.sha256"
    dest: /usr/local/bin/kubectl
    mode: "0755"
