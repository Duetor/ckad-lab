---
- name: Install minikube ({{ minikube_version }})
  become: true
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-{{ bin_arch }}"
    dest: /usr/local/bin/minikube
    mode: "0755"
    force: false

- name: Read the minikube cluster status
  ansible.builtin.command: minikube status -p {{ minikube_profile }} -o json
  register: minikube_status
  changed_when: false
  failed_when: false

- name: Determine whether the cluster is already running (rc=0 only if everything is Running)
  ansible.builtin.set_fact:
    minikube_running: "{{ minikube_status.rc == 0 }}"

# become_user opens a new session, so docker group membership is
# effective even if the user was just added to it.
- name: Start minikube (can take several minutes the first time)
  become: true
  become_user: "{{ lab_user }}"
  ansible.builtin.command: >-
    minikube start
    -p {{ minikube_profile }}
    --driver={{ minikube_driver }}
    --kubernetes-version={{ kubernetes_version }}
    --cni={{ minikube_cni }}
    --cpus={{ minikube_cpus }}
    --memory={{ minikube_memory_mb }}
    --addons={{ minikube_addons | join(',') }}
  changed_when: true
  when: not minikube_running | bool

- name: "Set the default minikube profile: {{ minikube_profile }}"
  ansible.builtin.command: minikube profile {{ minikube_profile }}
  changed_when: false

- name: Wait for the node to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false

- name: Wait for the Calico CNI
  ansible.builtin.command: >-
    kubectl -n kube-system wait --for=condition=Ready pod -l k8s-app=calico-node --timeout=300s
  changed_when: false
  when: minikube_cni == "calico"

- name: Wait for the ingress controller
  ansible.builtin.command: >-
    kubectl -n ingress-nginx wait --for=condition=Available deploy/ingress-nginx-controller --timeout=300s
  changed_when: false
  when: "'ingress' in minikube_addons"

- name: Get the cluster IP
  ansible.builtin.command: minikube ip -p {{ minikube_profile }}
  register: minikube_ip
  changed_when: false

- name: Resolve ckad.local to minikube (Ingress exercise)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\sckad\.local$'
    line: "{{ minikube_ip.stdout }} ckad.local"
